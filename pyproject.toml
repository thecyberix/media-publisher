[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-publisher"
version = "0.1.0"
description = "Extract media metadata from Airtable, HappyScribe, and Canva, then publish to social platforms."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
]

[project.scripts]
media-publisher = "media_publisher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
