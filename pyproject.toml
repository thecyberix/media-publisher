[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-publisher"
version = "0.1.0"
description = "Extract media metadata from Airtable, HappyScribe, and Canva, then publish to social platforms."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "tzdata>=2024.1",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
]
sheets = [
    "google-auth>=2.29.0",
]

[project.scripts]
media-publisher = "media_publisher.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
