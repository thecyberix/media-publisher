[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-publisher"
version = "0.1.0"
description = "Catalog ingest, translation workflow, and social publishing for Sadhguru Bulgarian content."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32.0",
    "tzdata>=2024.1",
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "google-api-python-client>=2.130.0",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "playwright>=1.49.0",
    "pynacl>=1.5.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.49.0",
]
sheets = [
    "google-auth>=2.29.0",
    "google-api-python-client>=2.130.0",
]
thumbnails = [
    "yt-dlp>=2024.12.0",
    "psd-tools[composite]>=1.10.0",
    "python-docx>=1.1.0",
    "aggdraw>=1.3.0",
]
align = [
    "whisperx>=3.3.0",
]

[project.scripts]
media-publisher = "media_publisher.__main__:main"
catalog-parser = "catalog_parser.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
