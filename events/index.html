<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Събития</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F9F4F3;
      --ink: #2B0B0B;
      --muted: #6B4A4A;
      --accent: #5E583A;
      --link: #4F6F8B;
      --rule: color-mix(in srgb, var(--ink) 14%, transparent);
      --button-fg: #f1f3f5;
    }
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
    }
    body {
      margin: 0;
      font-family: Merriweather, Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--bg);
      line-height: 1.55;
      text-align: center;
    }
    body.is-empty {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 1.5rem;
    }
    .coming-soon {
      margin: 0;
      text-align: center;
      font-size: clamp(2.2rem, 9vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--ink);
    }
    header {
      padding: 2.5rem 1.25rem 1.5rem;
      max-width: 72rem;
      margin: 0 auto;
    }
    header .profile {
      display: block;
      width: 8rem;
      height: 8rem;
      margin: 0 auto 1.25rem;
      border-radius: 16px;
      object-fit: cover;
    }
    header h1 {
      margin: 0;
      font-size: clamp(1.75rem, 4vw, 2.25rem);
      font-weight: 700;
      line-height: 1.25;
    }
    main {
      max-width: 72rem;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 2rem 1.5rem;
      text-align: left;
    }
    .event {
      flex: 0 1 22rem;
      width: min(100%, 22rem);
      padding: 1.25rem 1rem 0;
      border-top: 1px solid var(--rule);
    }
    .event h2 {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      line-height: 1.35;
      text-align: center;
    }
    .when {
      color: var(--muted);
      font-weight: 700;
      text-align: center;
    }
    .quote {
      font-style: italic;
    }
    .learn-more {
      margin: 1rem 0;
    }
    .yt-link {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      max-width: 100%;
      color: var(--link);
      text-decoration: none;
      vertical-align: middle;
    }
    .yt-link:hover .yt-title {
      text-decoration: underline;
    }
    .yt-icon {
      flex: 0 0 auto;
      width: 1.15rem;
      height: 1.15rem;
      display: block;
    }
    .yt-title {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .cta {
      text-align: center;
      margin: 1.25rem 0;
    }
    .cta a {
      display: inline-block;
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--accent);
      color: var(--button-fg);
      font-weight: 700;
      font-size: 1.05rem;
      text-decoration: none;
      border-radius: 30px;
    }
    .cta a:hover {
      filter: brightness(1.05);
    }
    a { color: var(--link); }
    ul {
      padding-left: 1.2rem;
      text-align: left;
    }
  </style>
</head>
<body class="is-empty">
<p class="coming-soon">Очаквайте скоро!</p>
</body>
</html>
