name: Setup Python environment
description: Python 3.12 with pip cache, optional Playwright Chromium cache, optional ffmpeg

inputs:
  install-playwright:
    description: Install Playwright Chromium (uses browser cache when possible)
    required: false
    default: "false"
  install-ffmpeg:
    description: Install ffmpeg via apt
    required: false
    default: "false"
  extras:
    description: Optional pip extras from pyproject.toml (e.g. thumbnails, sheets, align)
    required: false
    default: ""
  torch-cpu:
    description: Install CPU PyTorch 2.8 before extras (matches whisperx; for ubuntu runners without a GPU)
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pyproject.toml

    - name: Install ffmpeg
      if: inputs.install-ffmpeg == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y ffmpeg

    - name: Cache Playwright browsers
      if: inputs.install-playwright == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

    - name: Install CPU PyTorch
      if: inputs.torch-cpu == 'true'
      shell: bash
      run: |
        pip install --upgrade pip
        pip install -r constraints/whisperx-cpu.txt --index-url https://download.pytorch.org/whl/cpu

    - name: Install Python package
      shell: bash
      env:
        PIP_EXTRAS: ${{ inputs.extras }}
      run: |
        python -m pip install --upgrade pip
        if [ -n "$PIP_EXTRAS" ]; then
          pip install -e ".[$PIP_EXTRAS]" --upgrade-strategy only-if-needed
        else
          pip install -e .
        fi

    - name: Verify CPU Torch
      if: inputs.torch-cpu == 'true'
      shell: bash
      run: |
        python - <<'PY'
        import torch
        print("torch", torch.__version__)
        if "+cpu" not in torch.__version__:
            raise SystemExit(
                f"expected a CPU Torch wheel (+cpu), got {torch.__version__!r}"
            )
        PY

    - name: Install Playwright Chromium
      if: inputs.install-playwright == 'true'
      shell: bash
      run: playwright install chromium
