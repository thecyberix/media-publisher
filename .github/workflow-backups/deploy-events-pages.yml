name: Deploy events pages

# BACKUP — not active. This file lives outside .github/workflows/ so GitHub
# does not run it. Restore: copy to .github/workflows/deploy-events-pages.yml
#
# Redeploy the events/ GitHub Pages site without publishing a new event.
on:
  workflow_dispatch:

concurrency:
  group: deploy-events-pages
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: events

  deploy:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
