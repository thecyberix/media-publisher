name: Deploy events pages

# Deploy the static events/ site to GitHub Pages (no Facebook / no new event).
on:
  workflow_dispatch:

concurrency:
  group: deploy-events-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: events

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
