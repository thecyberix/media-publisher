name: Instagram comment replies

# Answers keyword comments on Inner Engineering and Miracle of Mind videos.
# Primary schedule: external cron (cron-job.org) → workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write

env:
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  META_PAGE_USERNAME: ${{ vars.META_PAGE_USERNAME }}
  META_INSTAGRAM_USERNAME: ${{ vars.META_INSTAGRAM_USERNAME }}
  TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE }}

jobs:
  respond:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "false"

      - name: Reply and DM on keyword comments
        id: respond
        env:
          PYTHONUNBUFFERED: "1"
        run: python scripts/respond_instagram_playlist_comments.py --apply

      - name: Commit comment response state
        if: steps.respond.outcome == 'success' || steps.respond.outcome == 'failure'
        run: |
          if [ ! -f data/instagram_comment_responses.json ]; then
            echo "No Instagram comment response state file."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/instagram_comment_responses.json
          if git diff --staged --quiet; then
            echo "No Instagram comment response state changes to commit."
          else
            git commit -m "Record Instagram comment replies and DMs"
            git push
          fi
