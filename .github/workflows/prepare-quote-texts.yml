name: Prepare quote translations

# Sync English quotes → Bulgarian month sheets (AI translate / reuse Ready).
# Runs with the daily catalog workflow, and can still be dispatched by itself.
on:
  workflow_dispatch:
    inputs:
      year:
        description: Optional year override (leave empty for current+next month)
        required: false
        type: string
        default: ""
      month:
        description: Optional month override 1-12 (requires year)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      year:
        description: Optional year override (leave empty for current+next month)
        required: false
        type: string
        default: ""
      month:
        description: Optional month override 1-12 (requires year)
        required: false
        type: string
        default: ""

permissions:
  contents: write

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  DRIVE_URL: ${{ vars.DRIVE_URL }}
  ENGLISH_QUOTES_URL: ${{ vars.ENGLISH_QUOTES_URL }}
  TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
  TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
  TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || '' }}
  TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE }}
  NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
  PUBLISH_JSON: ${{ vars.PUBLISH_JSON }}
  GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
  GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: prepare-quote-texts
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          extras: sheets

      - name: Restore translation corpus
        run: |
          mkdir -p data/corpus
          if [ -f data/translation-corpus.tar.gz ]; then
            tar -xzf data/translation-corpus.tar.gz -C data/corpus
          else
            echo "No translation corpus archive; AI quotes will use plain prompts"
          fi

      - name: Prepare quote texts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_ARGS=""
          if [ -n "${{ inputs.year }}" ] && [ -n "${{ inputs.month }}" ]; then
            EXTRA_ARGS="--year ${{ inputs.year }} --month ${{ inputs.month }}"
          fi
          python scripts/prepare_quote_texts.py ${EXTRA_ARGS}

      - name: Commit Ready quote cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/quotes_ready_index.json
          if git diff --staged --quiet; then
            echo "No Ready quote cache changes to commit."
          else
            git commit -m "Update Ready quote translation cache"
            git push
          fi
