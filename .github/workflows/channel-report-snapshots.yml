name: Channel report snapshots

# Capture follower/subscriber counts daily so Meta's short-retention metrics
# are preserved before the monthly report runs.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
  META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}

permissions:
  contents: write

jobs:
  capture-snapshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[sheets]"

      - name: Capture follower snapshots
        run: python -m media_publisher --channel-report-snapshot

      - name: Commit snapshot store
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/channel_report_snapshots.json
          if git diff --staged --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update channel report follower snapshots"
            git push
          fi
