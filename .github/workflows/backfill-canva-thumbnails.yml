name: Backfill Canva thumbnails

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Upload/replace Original Video Thumbnail (unchecked = dry-run)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          extras: thumbnails

      - name: Restore Canva token
        env:
          CANVA_TOKEN_JSON: ${{ secrets.CANVA_TOKEN_JSON }}
        run: |
          if [ -z "$CANVA_TOKEN_JSON" ]; then
            echo "No CANVA_TOKEN_JSON secret configured"
            exit 1
          fi
          mkdir -p credentials
          printf '%s' "$CANVA_TOKEN_JSON" > credentials/canva-token.json

      - name: Backfill Canva thumbnails
        env:
          TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE }}
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_URL: ${{ vars.AIRTABLE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || '' }}
          CONFIG_SYNC_PAT: ${{ secrets.CONFIG_SYNC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            python scripts/catalog/backfill_canva_thumbnails.py --apply
          else
            python scripts/catalog/backfill_canva_thumbnails.py --dry-run
          fi
