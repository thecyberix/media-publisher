name: Combine sync-done without subtitles

# Manual: generate Combined Media File for Synchronization done Video/Reel
# records that have no Translation resources, and write the Drive link to Airtable.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate mix inputs only (no upload / Airtable update)
        type: boolean
        default: false
      include_existing:
        description: Also recombine records that already have Combined Media File
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  combine:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"

      - name: Combine media for sync-done videos without subtitles
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTPUT_DRIVE_FOLDER: ${{ vars.OUTPUT_DRIVE_FOLDER || secrets.OUTPUT_DRIVE_FOLDER }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --dry-run"
          fi
          if [ "${{ inputs.include_existing }}" = "true" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --include-existing"
          fi
          python scripts/catalog/combine_sync_done_no_subtitles.py ${EXTRA_ARGS}
