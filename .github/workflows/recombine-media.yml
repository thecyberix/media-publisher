name: Recombine catalog media

# One-off / manual: remux Drive video+audio for a single Airtable record.
on:
  workflow_dispatch:
    inputs:
      title:
        description: Exact or unique substring of Airtable Title
        required: true
        type: string
      dry_run:
        description: Validate mix inputs only (no download/upload)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  recombine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"

      - name: Recombine media from Airtable title
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OUTPUT_DRIVE_FOLDER: ${{ vars.OUTPUT_DRIVE_FOLDER || secrets.OUTPUT_DRIVE_FOLDER }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python scripts/catalog/mix_drive_folder_media_from_airtable.py \
            --title "${{ inputs.title }}" \
            ${EXTRA_ARGS}
