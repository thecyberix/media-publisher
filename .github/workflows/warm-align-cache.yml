name: Warm WhisperX align cache

# Populate pip + wav2vec2 caches so the first real alignment job can restore them.
# GitHub deletes caches not accessed for 7 days; restoring this job refreshes that TTL.
on:
  schedule:
    # Sunday and Wednesday 04:00 UTC (~06:00 / 07:00 Sofia). Twice weekly so a
    # delayed GitHub cron still lands inside the 7-day window.
    - cron: "0 4 * * 0"
    - cron: "0 4 * * 3"
  workflow_dispatch:
  push:
    paths:
      - pyproject.toml
      - .github/workflows/warm-align-cache.yml
      - .github/actions/setup-python-env/action.yml
      - scripts/warm_align_cache.py

concurrency:
  group: warm-align-cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  warm:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          extras: align
          cache-align: "true"
          torch-cpu: "true"

      - name: Download WhisperX English align model
        run: python scripts/warm_align_cache.py --language en --device cpu
