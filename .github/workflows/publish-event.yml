name: Publish event

# Manually announce a Hatha programme (Surya Kriya, Bhuta Shuddhi, or Yogasanas).
# Updates events/ for GitHub Pages and posts a photo + caption to the Facebook Page.
on:
  workflow_dispatch:
    inputs:
      event_type:
        description: Programme type
        type: choice
        required: true
        default: Surya Kriya
        options:
          - Surya Kriya
          - Bhuta Shuddhi
          - Yogasanas
      city:
        description: City
        type: string
        required: true
      country:
        description: Country (blank = language country)
        type: string
        required: false
        default: ""
      date:
        description: Event date (YYYY-MM-DD)
        type: string
        required: true
      time:
        description: Event time (HH:MM)
        type: string
        required: true
      registration_link:
        description: Registration URL
        type: string
        required: true
      image_id:
        description: Optional image — Drive file id, filename (1.jpg), or number (1). Blank = rotate.
        type: string
        required: false
        default: ""
      dry_run:
        description: Preview only (no page commit, no Facebook post)
        type: boolean
        default: false
      skip_facebook:
        description: Update the public page only (no Facebook post)
        type: boolean
        default: false

concurrency:
  group: publish-event
  cancel-in-progress: false

env:
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  DRIVE_URL: ${{ vars.DRIVE_URL }}
  META_PAGE_USERNAME: ${{ vars.META_PAGE_USERNAME }}
  META_INSTAGRAM_USERNAME: ${{ vars.META_INSTAGRAM_USERNAME }}
  TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE }}
  PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Check Meta event scopes
        if: ${{ inputs.dry_run == false && inputs.skip_facebook == false }}
        run: python -m media_publisher --check-event-meta

      - name: Publish event
        env:
          EVENT_TYPE: ${{ inputs.event_type }}
          EVENT_CITY: ${{ inputs.city }}
          EVENT_COUNTRY: ${{ inputs.country }}
          EVENT_DATE: ${{ inputs.date }}
          EVENT_TIME: ${{ inputs.time }}
          EVENT_REGISTRATION_LINK: ${{ inputs.registration_link }}
          EVENT_IMAGE_ID: ${{ inputs.image_id }}
          EVENT_DRY_RUN: ${{ inputs.dry_run }}
          EVENT_SKIP_FACEBOOK: ${{ inputs.skip_facebook }}
        run: |
          set -euo pipefail
          args=(
            --publish-event
            --event-type "$EVENT_TYPE"
            --city "$EVENT_CITY"
            --date "$EVENT_DATE"
            --time "$EVENT_TIME"
            --registration-link "$EVENT_REGISTRATION_LINK"
          )
          if [ -n "${EVENT_COUNTRY:-}" ]; then
            args+=(--country "$EVENT_COUNTRY")
          fi
          if [ -n "${EVENT_IMAGE_ID:-}" ]; then
            args+=(--image-id "$EVENT_IMAGE_ID")
          fi
          if [ "$EVENT_DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$EVENT_SKIP_FACEBOOK" = "true" ]; then
            args+=(--skip-facebook)
          fi
          python -m media_publisher "${args[@]}"

      - name: Commit events site
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/data/events.json events/index.html
          if [ -f events/data/facebook-image-rotation.json ]; then
            git add events/data/facebook-image-rotation.json
          fi
          if git diff --cached --quiet; then
            echo "No events site changes to commit."
          else
            git commit -m "Add ${{ inputs.event_type }} event for ${{ inputs.city }} on ${{ inputs.date }}"
            git push
          fi

      - name: Upload Pages artifact
        if: ${{ inputs.dry_run == false }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: events

  deploy:
    needs: publish
    if: ${{ inputs.dry_run == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
