name: Ingest unassigned catalog videos

# Manual ingest from Google Sheets into Airtable without assigning a translator.
on:
  workflow_dispatch:
    inputs:
      video_type:
        description: Video type to ingest from the catalog sheet
        type: choice
        options:
          - Reel
          - Short
          - Video
        default: Reel
      count:
        description: Number of eligible videos to ingest
        type: number
        default: 4
      dry_run:
        description: Preview eligible rows without writing to Airtable
        type: boolean
        default: false

concurrency:
  group: catalog-ingest-unassigned
  cancel-in-progress: false

env:
  NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-playwright: "true"
          install-ffmpeg: "true"
          extras: thumbnails

      - name: Restore translation corpus
        run: |
          mkdir -p data/corpus
          tar -xzf data/translation-corpus.tar.gz -C data/corpus

      - name: Restore Smartcat session
        env:
          SMARTCAT_STORAGE_STATE_JSON: ${{ secrets.SMARTCAT_STORAGE_STATE_JSON }}
        run: |
          if [ -z "$SMARTCAT_STORAGE_STATE_JSON" ]; then
            echo "No SMARTCAT_STORAGE_STATE_JSON secret configured"
            exit 0
          fi
          printf '%s' "$SMARTCAT_STORAGE_STATE_JSON" > smartcat-state.json

      - name: Restore Canva token
        env:
          CANVA_TOKEN_JSON: ${{ secrets.CANVA_TOKEN_JSON }}
        run: |
          if [ -z "$CANVA_TOKEN_JSON" ]; then
            echo "No CANVA_TOKEN_JSON secret configured (Canva thumbnail export disabled)"
            exit 0
          fi
          mkdir -p credentials
          printf '%s' "$CANVA_TOKEN_JSON" > credentials/canva-token.json

      - name: Check authorization
        id: auth_check
        run: |
          python scripts/catalog/check_authorization.py \
            --smartcat-storage-state smartcat-state.json \
            --skip-smartcat-if-missing \
            --skip-canva-if-missing
        env:
          SMARTCAT_UI_BASE: https://ea.smartcat.com
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          # Sync rotated refresh tokens immediately; job-scoped secrets stay stale.
          CANVA_TOKEN_SYNC_PAT: ${{ secrets.CANVA_TOKEN_SYNC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Send authorization failure email
        if: failure() && steps.auth_check.outcome == 'failure'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          python scripts/catalog/send_notification_email.py \
            --subject "catalog-parser: authorization check failed" \
            --body "$(cat <<'EOF'
          The unassigned ingest workflow cannot run until authorization is renewed.

          Smartcat:
            1. python -m catalog_parser --smartcat-login
            2. Copy the new smartcat-state.json into the GitHub secret SMARTCAT_STORAGE_STATE_JSON

          Canva:
            1. python scripts/_canva_auth_interactive.py
            2. Confirm CANVA_TOKEN_JSON was updated (the script syncs it when CANVA_TOKEN_SYNC_PAT is set)

          Repository: ${{ github.repository }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

      - name: Show Drive service account email
        if: steps.auth_check.outcome == 'success'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/catalog/print_google_service_account_email.py

      - name: Ingest unassigned catalog videos
        if: steps.auth_check.outcome == 'success'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SMARTCAT_STORAGE_STATE: smartcat-state.json
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          # Do not rematerialize CANVA_TOKEN_JSON here — use the file from Restore.
          CANVA_TOKEN_SYNC_PAT: ${{ secrets.CANVA_TOKEN_SYNC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python -m catalog_parser ingest \
            --unassigned \
            --type "${{ inputs.video_type }}" \
            --count "${{ inputs.count }}" \
            ${EXTRA_ARGS}

      - name: Send ingest failure email
        if: failure() && steps.auth_check.outcome == 'success'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          python scripts/catalog/send_notification_email.py \
            --subject "catalog-parser: unassigned ingest failed" \
            --body "$(cat <<'EOF'
          The unassigned catalog ingest workflow failed.

          Repository: ${{ github.repository }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
