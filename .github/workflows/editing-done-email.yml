name: Editing done email

on:
  workflow_dispatch:
    inputs:
      title:
        description: Airtable title to include in the Editing done thumbnail email
        type: string
        required: true

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"
          extras: thumbnails

      - name: Send Editing done thumbnail email
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_URL: ${{ vars.AIRTABLE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
          TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/catalog/send_editing_done_thumbnail_email.py --title "${{ inputs.title }}"
