name: Publish

# Primary schedule: external cron (cron-job.org) → workflow_dispatch.
# Default publish mode is staggered: Instagram today, YouTube/Facebook tomorrow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to publish
        type: choice
        options:
          - all
          - videos
          - quotes
        default: all
      private:
        description: Revise mode (YT/FB at next publish slot)
        type: boolean
        default: false
      staggered:
        description: Standard mode (IG now, YT/FB tomorrow)
        type: boolean
        default: false
      schedule:
        description: Native schedule mode (YT/FB/IG due today)
        type: boolean
        default: false
      platform:
        description: Limit quotes/videos to one platform (retry-safe)
        type: choice
        options:
          - all
          - youtube
          - facebook
          - instagram
        default: all

env:
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
  AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
  HAPPYSCRIBE_API_KEY: ${{ secrets.HAPPYSCRIBE_API_KEY }}
  HAPPYSCRIBE_LIBRARY_URL: ${{ secrets.HAPPYSCRIBE_LIBRARY_URL }}
  HAPPYSCRIBE_ORGANIZATION_ID: ${{ secrets.HAPPYSCRIBE_ORGANIZATION_ID }}
  HAPPYSCRIBE_FOLDER_ID: ${{ secrets.HAPPYSCRIBE_FOLDER_ID }}
  CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
  CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
  META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
  YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
  CANVA_TOKEN_JSON: ${{ secrets.CANVA_TOKEN_JSON }}
  CANVA_TOKEN_SYNC_PAT: ${{ secrets.CANVA_TOKEN_SYNC_PAT }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
  GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
  NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
  GENERATED_QUOTES_NOTIFY_EMAIL: ${{ vars.GENERATED_QUOTES_NOTIFY_EMAIL }}
  PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE }}
  PUBLISH_HOUR: ${{ vars.PUBLISH_HOUR }}
  QUOTES_PUBLISH_TIMEZONE: ${{ vars.QUOTES_PUBLISH_TIMEZONE }}
  QUOTES_PUBLISH_HOUR: ${{ vars.QUOTES_PUBLISH_HOUR }}
  YOUTUBE_DAILY_PLAYLIST_ID: ${{ vars.YOUTUBE_DAILY_PLAYLIST_ID }}
  YOUTUBE_DAILY_PLAYLIST_TITLE: ${{ vars.YOUTUBE_DAILY_PLAYLIST_TITLE }}
  YOUTUBE_DAILY_PLAYLIST_SLOTS_JSON: ${{ vars.YOUTUBE_DAILY_PLAYLIST_SLOTS_JSON }}

jobs:
  videos:
    if: >-
      inputs.mode == 'all' || inputs.mode == 'videos'
    runs-on: ubuntu-latest
    # Long-form Videos (HappyScribe download + ffmpeg burn) can exceed 1h.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"
          extras: thumbnails

      - name: Verify configuration
        run: python -m media_publisher --check-config

      - name: Publish catalog videos
        env:
          PUBLISH_STAGGERED: ${{ inputs.staggered }}
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.schedule }}" = "true" ]; then
            EXTRA_ARGS="--schedule"
          elif [ "${{ inputs.private }}" = "true" ]; then
            EXTRA_ARGS="--private"
          fi
          if [ "${{ inputs.platform }}" != "all" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --platform ${{ inputs.platform }}"
          fi
          python -m media_publisher ${EXTRA_ARGS}

  quotes:
    if: >-
      inputs.mode == 'all' || inputs.mode == 'quotes'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"
          extras: thumbnails

      - name: Verify configuration
        run: python -m media_publisher --check-config

      - name: Publish daily quotes
        env:
          PUBLISH_STAGGERED: ${{ inputs.staggered }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.private }}" = "true" ]; then
            EXTRA_ARGS="--private"
          fi
          if [ "${{ inputs.platform }}" != "all" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --platform ${{ inputs.platform }}"
          fi
          python -m media_publisher --quotes ${EXTRA_ARGS}
