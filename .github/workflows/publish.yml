name: Publish videos and quotes

# Primary schedule: external cron (cron-job.org) → workflow_dispatch.
# Default timing is standard: Instagram today, YouTube/Facebook tomorrow.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: What to publish
        type: choice
        options:
          - all
          - videos
          - quotes
        default: all
      youtube:
        description: YouTube
        type: boolean
        default: true
      facebook:
        description: Facebook
        type: boolean
        default: true
      instagram:
        description: Instagram
        type: boolean
        default: true
      timing:
        description: "standard (IG today, YT/FB tomorrow); immediate (publish now); scheduled (next slot, skip IG)"
        type: choice
        options:
          - standard
          - immediate
          - scheduled
        default: standard

env:
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
  AIRTABLE_TABLE_NAME: ${{ secrets.AIRTABLE_TABLE_NAME }}
  HAPPYSCRIBE_API_KEY: ${{ secrets.HAPPYSCRIBE_API_KEY }}
  HAPPYSCRIBE_LIBRARY_URL: ${{ secrets.HAPPYSCRIBE_LIBRARY_URL }}
  HAPPYSCRIBE_ORGANIZATION_ID: ${{ secrets.HAPPYSCRIBE_ORGANIZATION_ID }}
  HAPPYSCRIBE_FOLDER_ID: ${{ secrets.HAPPYSCRIBE_FOLDER_ID }}
  CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
  CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
  META_APP_ID: ${{ secrets.META_APP_ID }}
  META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
  META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
  META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
  META_INSTAGRAM_ACCOUNT_ID: ${{ secrets.META_INSTAGRAM_ACCOUNT_ID }}
  YOUTUBE_CLIENT_SECRETS_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRETS_JSON }}
  YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
  CANVA_TOKEN_JSON: ${{ secrets.CANVA_TOKEN_JSON }}
  CANVA_TOKEN_SYNC_PAT: ${{ secrets.CANVA_TOKEN_SYNC_PAT }}
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
  GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
  NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
  GENERATED_QUOTES_NOTIFY_EMAIL: ${{ vars.GENERATED_QUOTES_NOTIFY_EMAIL }}
  PUBLISH_TIMEZONE: ${{ vars.PUBLISH_TIMEZONE }}
  PUBLISH_HOUR: ${{ vars.PUBLISH_HOUR }}
  QUOTES_PUBLISH_TIMEZONE: ${{ vars.QUOTES_PUBLISH_TIMEZONE }}
  QUOTES_PUBLISH_HOUR: ${{ vars.QUOTES_PUBLISH_HOUR }}
  YOUTUBE_DAILY_PLAYLIST_ID: ${{ vars.YOUTUBE_DAILY_PLAYLIST_ID }}
  YOUTUBE_DAILY_PLAYLIST_TITLE: ${{ vars.YOUTUBE_DAILY_PLAYLIST_TITLE }}
  YOUTUBE_DAILY_PLAYLIST_SLOTS_JSON: ${{ vars.YOUTUBE_DAILY_PLAYLIST_SLOTS_JSON }}

jobs:
  videos:
    if: >-
      inputs.mode == 'all' || inputs.mode == 'videos'
    runs-on: ubuntu-latest
    # Long-form Videos (HappyScribe download + ffmpeg burn) can exceed 1h.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"
          extras: thumbnails

      - name: Verify configuration
        run: python -m media_publisher --check-config

      - name: Publish catalog videos
        env:
          PUBLISH_STAGGERED: ${{ inputs.timing != 'immediate' }}
          PYTHONUNBUFFERED: "1"
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.timing }}" = "scheduled" ]; then
            EXTRA_ARGS="--private"
          fi
          PLATFORM_ARGS=""
          if [ "${{ inputs.youtube }}" = "true" ]; then
            PLATFORM_ARGS="${PLATFORM_ARGS} --platform youtube"
          fi
          if [ "${{ inputs.facebook }}" = "true" ]; then
            PLATFORM_ARGS="${PLATFORM_ARGS} --platform facebook"
          fi
          if [ "${{ inputs.instagram }}" = "true" ]; then
            PLATFORM_ARGS="${PLATFORM_ARGS} --platform instagram"
          fi
          if [ -z "$PLATFORM_ARGS" ]; then
            echo "Select at least one platform (YouTube, Facebook, Instagram)."
            exit 1
          fi
          python -m media_publisher ${EXTRA_ARGS} ${PLATFORM_ARGS}

  quotes:
    if: >-
      inputs.mode == 'all' || inputs.mode == 'quotes'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-ffmpeg: "true"
          extras: thumbnails

      - name: Verify configuration
        run: python -m media_publisher --check-config

      - name: Publish daily quotes
        env:
          PUBLISH_STAGGERED: ${{ inputs.timing != 'immediate' }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.timing }}" = "scheduled" ]; then
            EXTRA_ARGS="--private"
          fi
          PLATFORM_ARGS=""
          if [ "${{ inputs.youtube }}" = "true" ]; then
            PLATFORM_ARGS="${PLATFORM_ARGS} --platform youtube"
          fi
          if [ "${{ inputs.facebook }}" = "true" ]; then
            PLATFORM_ARGS="${PLATFORM_ARGS} --platform facebook"
          fi
          if [ "${{ inputs.instagram }}" = "true" ]; then
            PLATFORM_ARGS="${PLATFORM_ARGS} --platform instagram"
          fi
          if [ -z "$PLATFORM_ARGS" ]; then
            echo "Select at least one platform (YouTube, Facebook, Instagram)."
            exit 1
          fi
          python -m media_publisher --quotes ${EXTRA_ARGS} ${PLATFORM_ARGS}
