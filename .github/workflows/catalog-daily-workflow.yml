name: Daily catalog workflow

# Primary schedule: external cron (cron-job.org) → workflow_dispatch at 00:00 local time.
# GitHub schedule below is a fallback; remove it once external cron is verified (see docs/catalog-github-actions.md).
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan actions without modifying Airtable or Drive
        type: boolean
        default: false
      mode:
        description: Full daily workflow, or ingest only (no translator assignment)
        type: choice
        options:
          - full
          - ingest
        default: full
      video_type:
        description: Ingest only — catalog type
        type: choice
        options:
          - Reel
          - Short
          - Video
        default: Reel
      count:
        description: Ingest only — number of videos
        type: string
        default: "4"

concurrency:
  group: catalog-workflow
  cancel-in-progress: false

# Required so github.token can list/download prior workflow-state artifacts
# (status_history + Airtable backups) for the Reporting weekly-work chain.
permissions:
  actions: read
  contents: read

env:
  NOTIFY_EMAIL: ${{ vars.NOTIFY_EMAIL }}
  TARGET_LANGUAGE: ${{ vars.TARGET_LANGUAGE }}

jobs:
  workflow:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python environment
        uses: ./.github/actions/setup-python-env
        with:
          install-playwright: "true"
          install-ffmpeg: "true"
          extras: thumbnails,align
          torch-cpu: "true"

      - name: Restore translation corpus
        run: |
          mkdir -p data/corpus
          tar -xzf data/translation-corpus.tar.gz -C data/corpus
          ls -lh data/corpus/subtitle_pairs.jsonl data/corpus/metadata_pairs.jsonl \
            data/corpus/bm25_index.json data/corpus/holdout_titles.json

      - name: Restore Smartcat session
        env:
          SMARTCAT_STORAGE_STATE_JSON: ${{ secrets.SMARTCAT_STORAGE_STATE_JSON }}
        run: |
          if [ -z "$SMARTCAT_STORAGE_STATE_JSON" ]; then
            echo "No SMARTCAT_STORAGE_STATE_JSON secret configured"
            exit 0
          fi
          printf '%s' "$SMARTCAT_STORAGE_STATE_JSON" > smartcat-state.json

      - name: Restore Canva token
        env:
          CANVA_TOKEN_JSON: ${{ secrets.CANVA_TOKEN_JSON }}
        run: |
          if [ -z "$CANVA_TOKEN_JSON" ]; then
            echo "No CANVA_TOKEN_JSON secret configured"
            exit 0
          fi
          mkdir -p credentials
          printf '%s' "$CANVA_TOKEN_JSON" > credentials/canva-token.json

      - name: Check authorization
        id: auth_check
        run: |
          python scripts/catalog/check_authorization.py \
            --smartcat-storage-state smartcat-state.json \
            --skip-smartcat-if-missing \
            --skip-canva
        env:
          SMARTCAT_UI_BASE: https://ea.smartcat.com

      - name: Send authorization failure email
        if: failure() && steps.auth_check.outcome == 'failure'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          python scripts/catalog/send_notification_email.py \
            --subject "catalog-parser: authorization check failed" \
            --body "$(cat <<'EOF'
          The scheduled GitHub Actions authorization check failed.

          Smartcat ingest will not work until the session is renewed.

          Smartcat:
            1. python -m catalog_parser --smartcat-login
            2. Copy the new smartcat-state.json into the GitHub secret SMARTCAT_STORAGE_STATE_JSON

          Canva is refreshed and probed at catalog orchestration start, not in this step.

          Repository: ${{ github.repository }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"

      - name: Restore workflow state from previous run
        if: >-
          steps.auth_check.outcome == 'success'
          && inputs.mode != 'ingest'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output/workflow output/backups
          latest_run=$(gh run list --workflow=catalog-daily-workflow.yml --status=success --limit 10 --json databaseId -q '.[0].databaseId' || true)
          if [ -z "$latest_run" ]; then
            echo "No successful daily workflow run found to restore from"
            exit 0
          fi
          gh run download "$latest_run" -n workflow-state -D /tmp/workflow-state-restore || true
          # upload-artifact@v4 strips the common "output/" prefix, so files usually
          # land as backups/... and workflow/...; also accept legacy output/... paths.
          restore_state_file() {
            rel="$1"
            dest="$2"
            for candidate in \
              "/tmp/workflow-state-restore/${rel}" \
              "/tmp/workflow-state-restore/output/${rel}"
            do
              if [ -f "$candidate" ]; then
                mkdir -p "$(dirname "$dest")"
                cp "$candidate" "$dest"
                echo "Restored ${dest} from ${candidate}"
                return 0
              fi
            done
            echo "No artifact file for ${rel}"
            return 0
          }
          restore_state_file "workflow/status_history.json" "output/workflow/status_history.json"
          restore_state_file "backups/airtable-latest.json" "output/backups/airtable-latest.json"
          restore_state_file "backups/airtable-archive-titles.json" "output/backups/airtable-archive-titles.json"

      - name: Show Drive service account email
        if: >-
          steps.auth_check.outcome == 'success'
          && inputs.mode != 'ingest'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python scripts/catalog/print_google_service_account_email.py

      - name: Run unassigned ingest
        if: >-
          steps.auth_check.outcome == 'success'
          && inputs.mode == 'ingest'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_URL: ${{ vars.AIRTABLE_URL }}
          DRIVE_URL: ${{ vars.DRIVE_URL }}
          WORKFLOW_PROFILES_JSON: ${{ vars.WORKFLOW_PROFILES_JSON || secrets.WORKFLOW_PROFILES_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMARTCAT_STORAGE_STATE: smartcat-state.json
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || '' }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_URL: ${{ vars.CANVA_URL }}
          PUBLISH_JSON: ${{ vars.PUBLISH_JSON }}
          CONFIG_SYNC_PAT: ${{ secrets.CONFIG_SYNC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          set -euo pipefail
          COUNT="${{ inputs.count }}"
          COUNT="${COUNT:-4}"
          if ! [[ "$COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "count must be a positive integer, got: $COUNT" >&2
            exit 1
          fi
          TYPE=$(echo "${{ inputs.video_type }}" | tr '[:upper:]' '[:lower:]')
          EXTRA_ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_ARGS="--dry-run"
          fi
          python -m catalog_parser ingest --unassigned --type "$TYPE" --count "$COUNT" $EXTRA_ARGS

      - name: Run workflow orchestrator
        if: >-
          steps.auth_check.outcome == 'success'
          && inputs.mode != 'ingest'
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_URL: ${{ vars.AIRTABLE_URL }}
          DRIVE_URL: ${{ vars.DRIVE_URL }}
          WORKFLOW_PROFILES_JSON: ${{ vars.WORKFLOW_PROFILES_JSON || secrets.WORKFLOW_PROFILES_JSON }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SMARTCAT_STORAGE_STATE: smartcat-state.json
          TRANSLATION_API_KEY: ${{ secrets.TRANSLATION_API_KEY }}
          TRANSLATION_PROVIDER: ${{ vars.TRANSLATION_PROVIDER }}
          TRANSLATION_MODEL: ${{ vars.TRANSLATION_MODEL || '' }}
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_URL: ${{ vars.CANVA_URL }}
          PUBLISH_JSON: ${{ vars.PUBLISH_JSON }}
          # Do not rematerialize CANVA_TOKEN_JSON here: the Restore step already
          # wrote credentials/canva-token.json, and re-injecting the job-scoped
          # (possibly stale) secret after a refresh revokes Canva's single-use
          # refresh token lineage.
          CONFIG_SYNC_PAT: ${{ secrets.CONFIG_SYNC_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m catalog_parser --dry-run
          else
            python -m catalog_parser
          fi

      - name: Check HappyScribe watch library
        id: hs_watch
        if: >-
          always()
          && steps.auth_check.outcome == 'success'
          && inputs.mode != 'ingest'
        env:
          HAPPYSCRIBE_API_KEY: ${{ secrets.HAPPYSCRIBE_API_KEY }}
        run: |
          mkdir -p output
          set +e
          python scripts/catalog/check_happyscribe_library.py \
            --skip-if-missing \
            --body-file output/happyscribe-watch-alert.txt
          code=$?
          if [ "$code" -eq 2 ]; then
            echo "status=non_empty" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 0 ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "status=error" >> "$GITHUB_OUTPUT"
          echo "HappyScribe watch check failed with exit code $code" >&2
          exit 0

      - name: Send HappyScribe non-empty email
        if: always() && steps.hs_watch.outputs.status == 'non_empty'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          python scripts/catalog/send_notification_email.py \
            --subject "catalog-parser: HappyScribe library is not empty" \
            --body "$(cat output/happyscribe-watch-alert.txt)"

      - name: Upload Airtable backup artifact
        if: >-
          always()
          && steps.auth_check.outcome == 'success'
          && inputs.mode != 'ingest'
        uses: actions/upload-artifact@v4
        with:
          name: airtable-backup-${{ github.run_number }}
          path: output/backups/airtable-latest.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload workflow state artifact
        if: >-
          always()
          && steps.auth_check.outcome == 'success'
          && inputs.mode != 'ingest'
        uses: actions/upload-artifact@v4
        with:
          name: workflow-state
          path: |
            output/workflow/status_history.json
            output/backups/airtable-latest.json
            output/backups/airtable-archive-titles.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Send workflow failure email
        if: failure() && steps.auth_check.outcome == 'success'
        env:
          GMAIL_SMTP_USER: ${{ secrets.GMAIL_SMTP_USER }}
          GMAIL_SMTP_APP_PASSWORD: ${{ secrets.GMAIL_SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL: ${{ env.NOTIFY_EMAIL }}
        run: |
          python scripts/catalog/send_notification_email.py \
            --subject "catalog-parser: daily workflow failed" \
            --body "$(cat <<'EOF'
          The catalog-parser GitHub Actions workflow failed.

          Check the logs for details (Airtable, Drive, ingest, or other errors).

          Repository: ${{ github.repository }}
          Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )"
