name: Prune past events

# Daily cleanup: remove past events from events/ and redeploy GitHub Pages.
# 21:00 UTC ≈ 00:00 Europe/Sofia (EEST) / 23:00 (EET).
on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only (no commit / no Pages deploy)
        type: boolean
        default: false

concurrency:
  group: prune-past-events
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-python-env

      - name: Prune past events
        env:
          EVENT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
        run: |
          set -euo pipefail
          if [ "$EVENT_DRY_RUN" = "true" ]; then
            python -m media_publisher --prune-past-events --dry-run
          else
            python -m media_publisher --prune-past-events
          fi

      - name: Commit events site
        id: commit
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events/data/events.json events/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No past events to remove."
          else
            git commit -m "Prune past events from the public page"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Pages artifact
        if: ${{ steps.commit.outputs.changed == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: events

  deploy:
    needs: prune
    if: ${{ needs.prune.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
